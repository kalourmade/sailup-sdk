[project]
name = "kalourmade-sailup"
version = "0.1.1"
description = "Python SDK for the Sailup SMS gateway"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/kalourmade/sailup-sdk"
Repository = "https://github.com/kalourmade/sailup-sdk"
Issues = "https://github.com/kalourmade/sailup-sdk/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
